#ctrl_interface=DIR=/var/run/wpa_supplicant GROUP=netdev
update_config=1

network={
    ssid="PCAP-Lab"
    key_mgmt=WPA-EAP
    eap=PEAP
    identity="MyName"
    anonymous_identity="MyName"
    password="mypassword"
    phase2="auth=MSCHAPV2"
    # Critical for validation:
    ca_cert="/usr/share/ca-certificates/mozilla/SSL.com_TLS_RSA_Root_CA_2022.crt"        
    # Optional tighter checks:
    # subject_match="/CN=expected-radius.example.com"
    # domain_suffix_match="example.com"
    # phase1="peapver=0 peaplabel=0"
}
