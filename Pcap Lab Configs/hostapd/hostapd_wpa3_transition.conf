interface=wlx9cefd5f6950a
driver=nl80211
ssid=PCAP-Lab
hw_mode=a
channel=36
country_code=US
ieee80211n=1
wmm_enabled=1

# WPA2-PSK and WPA3-SAE on the same SSID
wpa=2
wpa_key_mgmt=WPA-PSK SAE
rsn_pairwise=CCMP
wpa_passphrase=Testlab12345
sae_password=Testlab12345

# PMF capable, not required, so WPA2 clients can still join
# PMF: 0 = disabled, 1 = capable (optional), 2 = required
ieee80211w=1

# SAE clients must still use PMF
sae_require_mfp=1
