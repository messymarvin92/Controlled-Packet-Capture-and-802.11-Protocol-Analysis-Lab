interface=wlx9cefd5f6950a
driver=nl80211

ssid=PCAP-Lab
hw_mode=a
channel=36
country_code=US
beacon_int=100
ieee80211n=1

auth_algs=1
wpa=2
wpa_key_mgmt=WPA-EAP
rsn_pairwise=CCMP

ieee8021x=1

auth_server_addr=192.168.1.10
auth_server_port=1812
auth_server_shared_secret=Testlab12345

# Built-in EAP server
eap_server=1
eap_user_file=/etc/hostapd/hostapd.eap_user

# Server certificate for PEAP's TLS tunnel
ca_cert=/etc/hostapd/certs/ca.pem
server_cert=/etc/hostapd/certs/server.pem
private_key=/etc/hostapd/certs/server.key
private_key_passwd=

# Optional: PMF
ieee80211w=1
